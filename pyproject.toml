[project]
name = "cloudtransfer"
version = "1.3.0"
description = "Disk-free streaming transfer between Google Drive and OneDrive"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "cryptography>=43.0",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7"]
# The tray icon for the packaged desktop build. The launcher falls back to a
# console window when these are absent, so they stay optional.
desktop = ["pystray>=0.19.5", "pillow>=10.4"]
build = ["pyinstaller>=6.11"]

[project.scripts]
cloudtransfer = "cloudtransfer.cli:main"

[project.gui-scripts]
cloudtransfer-desktop = "cloudtransfer.cli:main_desktop"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cloudtransfer*"]

[tool.setuptools.package-data]
"cloudtransfer.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's Depends()/Query() in defaults is the documented idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# ASYNC109: these test helpers hand their timeout straight to asyncio.wait_for
# or a loop deadline, which is what the rule asks for.
"tests/*" = ["ASYNC109"]
