name: Release

# Builds the Windows installer. PyInstaller cannot cross-compile, so this has
# to run on Windows - which is the whole reason the release is built here
# rather than on a developer's machine.
#
# Three ways in, so no route leaves someone stuck:
#
#   * push a tag:   git tag v1.0.0 && git push origin v1.0.0
#   * publish a release on github.com, which creates the tag for you
#   * run this workflow by hand, for an installer without a release
#
# The release trigger is not redundant: a tag created through the Releases page
# does not always raise a push event, and the installer never appearing on the
# release is a confusing way to find that out.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the build (e.g. 1.0.1)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

# Both triggers can fire for one tag. Build it once rather than twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF -replace "^refs/tags/v", ""
          } else {
            $v = "${{ github.event.inputs.version }}"
            if (-not $v) { $v = "0.0.0-dev" }
          }
          Write-Host "version: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,build]"

      - name: Build the application
        run: pyinstaller packaging/cloudtransfer.spec --noconfirm

      - name: Check the packaged build starts
        shell: pwsh
        run: |
          $env:CT_PORT = "8798"
          $proc = Start-Process -FilePath "dist\CloudTransfer\CloudTransfer.exe" `
            -ArgumentList "desktop","--no-browser","--no-tray" -PassThru
          try {
            $ok = $false
            foreach ($attempt in 1..40) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8798/healthz" -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "the packaged build did not start" }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\installer

      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem dist\installer\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath "dist\installer\SHA256SUMS.txt" -Append -Encoding ascii
            Write-Host "$hash  $($_.Name)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: CloudTransfer-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Installing

            Download `CloudTransfer-Setup-${{ steps.version.outputs.version }}.exe` and run it.
            It installs for the current user only, so no administrator rights are needed.

            Windows SmartScreen will warn that the publisher is unknown: the
            installer is not code-signed, which needs a paid certificate.
            Choose **More info -> Run anyway** if you trust this build, or build
            it yourself from source.

            On first run the application opens in your browser and walks you
            through registering a Google and a Microsoft application. Nothing
            needs to be configured in a file.
