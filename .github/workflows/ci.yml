name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,desktop]"

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q

  packaging:
    name: Packaging smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,build]"

      - name: Build the application
        run: pyinstaller packaging/cloudtransfer.spec --noconfirm

      # A build that produces an executable which cannot start is worse than no
      # build, so prove it serves before calling the job green.
      - name: Check the packaged build actually runs
        shell: pwsh
        run: |
          $env:CT_PORT = "8799"
          $proc = Start-Process -FilePath "dist\CloudTransfer\CloudTransfer.exe" `
            -ArgumentList "desktop","--no-browser","--no-tray" -PassThru
          try {
            $ok = $false
            foreach ($attempt in 1..40) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8799/healthz" -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) {
                  Write-Host "healthz: $($r.Content)"
                  $page = Invoke-WebRequest -Uri "http://127.0.0.1:8799/" -UseBasicParsing -TimeoutSec 5
                  if ($page.Content -notmatch "Set up access") {
                    throw "the interface did not render; templates are probably missing"
                  }
                  $css = Invoke-WebRequest -Uri "http://127.0.0.1:8799/static/style.css" -UseBasicParsing
                  Write-Host "stylesheet: $($css.RawContentLength) bytes"
                  $ok = $true
                  break
                }
              } catch { }
            }
            if (-not $ok) { throw "the packaged build did not start" }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Build the installer here too, not only on release. A broken installer
      # script is otherwise invisible until the moment it matters, which is
      # exactly how a pre-release version string once got through.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          # Deliberately a pre-release-shaped version: VersionInfoVersion only
          # takes numbers, so the suffix handling has to be exercised.
          & $iscc "/DAppVersion=0.0.0-ci" "packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $exe = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          if (-not $exe) { throw "no installer was produced" }
          Write-Host "installer: $($exe.Name), $([math]::Round($exe.Length / 1MB, 1)) MB"
